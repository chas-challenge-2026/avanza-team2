name: Native CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential libcurl4-openssl-dev

    - name: Install
      working-directory: ./native
      run: sudo make install UID=$(id -u) GID=$(id -g)

    - name: Build all
      working-directory: ./native
      run: make all AVX_LEVEL=avx2

    - name: Run risk test
      working-directory: ./native
      run: make risk/test-run AVX_LEVEL=avx2

    - name: Run fx offline parse test
      working-directory: ./native
      run: make fx/run

    - name: Run fx live fetch test
      working-directory: ./native
      run: make fx/run-live
      continue-on-error: true

    - name: Build JNA PoC
      working-directory: ./native
      run: make jna_poc/install

    - name: Clean
      working-directory: ./native
      run: make clean

